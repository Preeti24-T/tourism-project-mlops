name: Wellness Tourism XGBoost MLOps

on:
  push:
    branches: [main]
    paths-ignore:
      - "models/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data_validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate dataset
        run: python model_building/data_registration.py

  data_preparation:
    needs: data_validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Prepare dataset
        run: python model_building/prep.py
      - name: Verify prepared data
        run: |
          python - <<'PY'
          import pandas as pd
          train = pd.read_csv('artifacts/train.csv')
          test = pd.read_csv('artifacts/test.csv')
          assert train.shape == (3302, 15), train.shape
          assert test.shape == (826, 15), test.shape
          for frame in (train, test):
              assert {'CustomerID', 'ProdTaken'}.issubset(frame.columns)
          print('Prepared data validated:', train.shape, test.shape)
          PY
      - name: Upload prepared data
        uses: actions/upload-artifact@v5
        with:
          name: prepared-data
          path: |
            artifacts/train.csv
            artifacts/test.csv
          if-no-files-found: error

  model_training:
    needs: data_preparation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Verify training dependencies
        run: |
          python -c "import pandas, numpy, sklearn, xgboost, mlflow, joblib; print('Training dependencies OK')"
      - name: Download prepared data
        uses: actions/download-artifact@v5
        with:
          name: prepared-data
          path: artifacts
      - name: Verify downloaded data
        run: |
          python - <<'PY'
          import pandas as pd
          train = pd.read_csv('artifacts/train.csv')
          test = pd.read_csv('artifacts/test.csv')
          assert train.shape == (3302, 15), train.shape
