name: Wellness Tourism XGBoost MLOps

on:
  push:
    branches: [main]
    paths-ignore:
      - "models/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  data_validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate dataset
        run: python model_building/data_registration.py

  data_preparation:
    needs: data_validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare dataset
        run: python model_building/prep.py

      - name: Upload prepared data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: artifacts/*.csv

  model_training:
    needs: data_preparation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: artifacts

      - name: Train XGBoost
        run: python model_building/train.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Upload prediction results
        uses: actions/upload-artifact@v4
        with:
          name: customer-predictions
          path: artifacts/customer_predictions.csv

      - name: Commit model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/best_model.joblib models/metrics.json models/feature_schema.json
          if ! git diff --cached --quiet; then
            git commit -m "Update XGBoost model [skip ci]"
            git push origin HEAD:main
          fi
