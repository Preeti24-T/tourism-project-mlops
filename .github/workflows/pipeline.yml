name: Wellness Tourism XGBoost MLOps

on:
  push:
    branches: [main]
    paths-ignore:
      - "models/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  data_validation:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate original dataset
        run: python -u model_building/data_registration.py

  data_preparation:
    needs: data_validation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Prepare training and testing datasets
        run: python -u model_building/prep.py
      - name: Check prepared data
        run: |
          python -c "import pandas as pd; a=pd.read_csv('artifacts/train.csv'); b=pd.read_csv('artifacts/test.csv'); print('Train:',a.shape,'Test:',b.shape); assert a.shape==(3302,15) and b.shape==(826,15); assert {'CustomerID','ProdTaken'} <= set(a.columns) and {'CustomerID','ProdTaken'} <= set(b.columns)"
      - name: Upload prepared data
        uses: actions/upload-artifact@v6
        with:
          name: prepared-data
          path: |
            artifacts/train.csv
            artifacts/test.csv
          if-no-files-found: error

  model_training:
    needs: data_preparation
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Print training library versions
        run: |
          python -c "import sys, sklearn, xgboost, joblib, numpy, pandas, mlflow; print('Python:',sys.version); print('scikit-learn:',sklearn.__version__); print('xgboost:',xgboost.__version__); print('joblib:',joblib.__version__); print('numpy:',numpy.__version__); print('pandas:',pandas.__version__); print('mlflow:',mlflow.__version__)"
          python -m pip freeze > training-dependencies.txt
      - name: Upload training dependency versions
        uses: actions/upload-artifact@v6
        with:
          name: training-dependencies
          path: training-dependencies.txt
          if-no-files-found: error
      - name: Download prepared data
        uses: actions/download-artifact@v7
        with:
          name: prepared-data
          path: artifacts
      - name: Check downloaded data and pre-contact features
        run: |
          python -c "import pandas as pd; a=pd.read_csv('artifacts/train.csv'); b=pd.read_csv('artifacts/test.csv'); excluded={'TypeofContact','DurationOfPitch','NumberOfFollowups','ProductPitched','PitchSatisfactionScore'}; print('Train:',a.shape,'Test:',b.shape); assert a.shape==(3302,15) and b.shape==(826,15); assert not excluded.intersection(a.columns) and not excluded.intersection(b.columns)"
      - name: Train XGBoost and save model
        run: python -u model_building/train.py
      - name: Check model artifacts
        run: |
          python -c "from pathlib import Path; import pandas as pd; m=Path('models'); assert all((m/f).is_file() for f in ['best_model.joblib','metrics.json','feature_schema.json']); p=pd.read_csv('artifacts/customer_predictions.csv'); print('Prediction rows:',len(p)); assert len(p)==826 and 'CustomerID' in p.columns"
      - name: Upload model artifacts
        uses: actions/upload-artifact@v6
        with:
          name: trained-model
          path: |
            models/best_model.joblib
            models/metrics.json
            models/feature_schema.json
          if-no-files-found: error
      - name: Upload customer predictions
        uses: actions/upload-artifact@v6
        with:
          name: customer-predictions
          path: artifacts/customer_predictions.csv
          if-no-files-found: error
      - name: Commit updated model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/best_model.joblib models/metrics.json models/feature_schema.json
          if ! git diff --cached --quiet; then
            git commit -m "Update XGBoost model [skip ci]"
            git push origin HEAD:main
          else
            echo "No model changes to commit."
          fi
