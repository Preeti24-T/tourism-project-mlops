name: Wellness Tourism XGBoost MLOps

on:
  push:
    branches: [main]
    paths-ignore:
      - "models/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:

  data_validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate dataset
        run: python model_building/data_registration.py

  data_preparation:
    needs: data_validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare dataset
        run: python model_building/prep.py

      - name: Upload prepared data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: artifacts/*.csv

  model_training:
    needs: data_preparation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: artifacts

        model_training:
    needs: data_preparation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify training dependencies
        run: |
          python -c "import pandas; print('Pandas OK')"
          python -c "import sklearn; print('Scikit-learn OK')"
          python -c "import xgboost; print('XGBoost OK')"
          python -c "import mlflow; print('MLflow OK')"
          python -c "import joblib; print('Joblib OK')"

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: artifacts

      - name: Verify prepared datasets
        run: |
          python -c "import pandas as pd; train=pd.read_csv('artifacts/train.csv'); test=pd.read_csv('artifacts/test.csv'); print('Train:', train.shape); print('Test:', test.shape); assert train.shape == (3302, 15); assert test.shape == (826, 15)"

      - name: Train XGBoost
        run: python -u model_building/train.py

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Upload prediction results
        uses: actions/upload-artifact@v4
        with:
          name: customer-predictions
          path: artifacts/customer_predictions.csv

      - name: Commit model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/best_model.joblib models/metrics.json models/feature_schema.json
          if ! git diff --cached --quiet; then
            git commit -m "Update XGBoost model [skip ci]"
            git push origin HEAD:main
          fi

     
      - name: Verify prepared datasets
        run: |
          python - <<'PY'
          import pandas as pd

          train = pd.read_csv("artifacts/train.csv")
          test = pd.read_csv("artifacts/test.csv")

          print("Train shape:", train.shape)
          print("Test shape:", test.shape)
          print("Training columns:", train.columns.tolist())

          assert train.shape == (3302, 15)
          assert test.shape == (826, 15)

          print("Prepared data validation passed.")
          PY

      - name: Train XGBoost
        run: python -u model_building/train.py
      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Upload prediction results
        uses: actions/upload-artifact@v4
        with:
          name: customer-predictions
          path: artifacts/customer_predictions.csv

      - name: Commit model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add models/best_model.joblib models/metrics.json models/feature_schema.json
          if ! git diff --cached --quiet; then
            git commit -m "Update XGBoost model [skip ci]"
            git push origin HEAD:main
          fi
