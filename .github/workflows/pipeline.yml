
name: Wellness Tourism XGBoost MLOps

on:
  push:
    branches:
      - main
    paths-ignore:
      - "models/**"
      - "README.md"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  # ==========================================================
  # JOB 1: DATA VALIDATION
  # ==========================================================
  data_validation:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate dataset
        run: python model_building/data_registration.py

  # ==========================================================
  # JOB 2: DATA PREPARATION
  # ==========================================================
  data_preparation:
    needs: data_validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Prepare dataset
        run: python model_building/prep.py

      - name: Verify prepared data
        run: |
          python - <<'PY'
          import pandas as pd

          train = pd.read_csv("artifacts/train.csv")
          test = pd.read_csv("artifacts/test.csv")

          print("Training shape:", train.shape)
          print("Testing shape:", test.shape)

          assert train.shape == (3302, 15)
          assert test.shape == (826, 15)
          assert "CustomerID" in train.columns
          assert "CustomerID" in test.columns
          assert "ProdTaken" in train.columns
          assert "ProdTaken" in test.columns

          print("Data preparation validation passed.")
          PY

      - name: Upload prepared data
        uses: actions/upload-artifact@v4
        with:
          name: prepared-data
          path: |
            artifacts/train.csv
            artifacts/test.csv
          if-no-files-found: error

  # ==========================================================
  # JOB 3: MODEL TRAINING
  # ==========================================================
  model_training:
    needs: data_preparation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify training dependencies
        run: |
          python -c "import pandas; print('Pandas OK')"
          python -c "import numpy; print('NumPy OK')"
          python -c "import sklearn; print('Scikit-learn OK')"
          python -c "import xgboost; print('XGBoost OK')"
          python -c "import mlflow; print('MLflow OK')"
          python -c "import joblib; print('Joblib OK')"

      - name: Download prepared data
        uses: actions/download-artifact@v4
        with:
          name: prepared-data
          path: artifacts

      - name: Verify downloaded data
        run: |
          python - <<'PY'
          import pandas as pd

          train = pd.read_csv("artifacts/train.csv")
          test = pd.read_csv("artifacts/test.csv")

          print("Training shape:", train.shape)
          print("Testing shape:", test.shape)
          print("Training columns:", train.columns.tolist())

          assert train.shape == (3302, 15)
          assert test.shape == (826, 15)

          excluded = {
              "TypeofContact",
              "DurationOfPitch",
              "NumberOfFollowups",
              "ProductPitched",
              "PitchSatisfactionScore"
          }

          assert not excluded.intersection(train.columns)
          assert not excluded.intersection(test.columns)

          print("Downloaded data validation passed.")
          PY

      - name: Train XGBoost model
        run: python -u model_building/train.py

      - name: Verify model outputs
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import pandas as pd

          model_dir = Path("models")

          assert (model_dir / "best_model.joblib").is_file()
          assert (model_dir / "metrics.json").is_file()
          assert (model_dir / "feature_schema.json").is_file()

          with open(model_dir / "feature_schema.json") as f:
              schema = json.load(f)

          assert len(schema["columns"]) == 13

          predictions = pd.read_csv(
              "artifacts/customer_predictions.csv"
          )

          assert len(predictions) == 826
          assert "CustomerID" in predictions.columns

          print("Model artifact validation passed.")
          PY

      - name: Upload model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/best_model.joblib
            models/metrics.json
            models/feature_schema.json
          if-no-files-found: error

      - name: Upload customer predictions
        uses: actions/upload-artifact@v4
        with:
          name: customer-predictions
          path: artifacts/customer_predictions.csv
          if-no-files-found: error

      - name: Commit model files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -f models/best_model.joblib
          git add -f models/metrics.json
          git add -f models/feature_schema.json

          if ! git diff --cached --quiet; then
            git commit -m "Update XGBoost model [skip ci]"
            git push origin HEAD:main
          else
            echo "No model changes to commit."
          fi
